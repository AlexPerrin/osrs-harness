# Harness policy v6 (BR-P*): one versioned file read by the daemon, the hooks and the briefs. Rules, not prose.
version: 6

tracks:
  client:
    live_target: master              # a client change is live when master contains its commit
    branch_prefixes: [client/]
    dev_role: client-dev
    qa_role: client-qa
  server:
    live_target: integration         # pin = commit and the live server runs that integration (live.json)
    branch_prefixes: [content/, fix/, local/]
    dev_role: server-dev
    qa_role: server-qa
    ci_equivalence:                  # what stands for what in CI: upstream PR checks <-> the gate's fork scratch run
      fork_workflow: ci.yml          # dispatched on the fork's gate/<slug> branch
      fork_workflow_name: CI         # its run name; one green run covers every required upstream check
      format_workflow: Formatting    # dispatched on the same branch; the gate needs it green too
      format_workflow_name: Formatting
      upstream_required: [build, gameval]   # check names (substring) an upstream PR must show green
      upstream_advisory: [advisory]         # shown, never required
  harness:
    live_target: main                # this repo's main (not the client's master): a harness change is live when it contains the commit
    branch_prefixes: [harness/]
    dev_role: harness-dev

repos:
  ours: AlexPerrin/osrs-plugins-reverse
  fork: AlexPerrin/OpenRune-Server
  upstream: OpenRune/OpenRune-Server
  fork_remote: fork
  upstream_remote: origin
  docs_branch: docs

resources:                           # locks on shared resources only (BR-R1); client instances are per agent, not locked
  integration: {kind: lock}          # the integration clone and its lease push: one train at a time (BR-B2)
  live-server: {kind: lock}          # a deploy
  ghidra:      {kind: lock}          # the one Ghidra project writer

capacity:                            # BR-R5: the machine budget; dispatch waits for a free slot in every class a role uses
  agent: 3                           # running agents in total
  build: 2                           # gradle and APK builds
  client: 2                          # desktop RuneLite clients, each with its own port and account
  device: 0                          # the Android app (BlueStacks): client-dev holds it; raise to 1 when BlueStacks is up
  image: 1                           # an image build and its boot check

batches:
  release_after_live_changes: 6      # BR-B6: a release batch after N live client changes (or on demand)
  uses: {gating: [build], imaging: [image]}   # the capacity classes a train step holds

settle_first: true                   # BR-C5: a change that settles an open PR (a review fix) outranks every derived priority

agents:
  roles:                             # uses: the capacity classes a run holds while it is alive
    client-dev:  {track: client, stage: dev,  worktree: true,  pushes: [], uses: [agent, device, build]}
    server-dev:  {track: server, stage: dev,  worktree: false, pushes: [fork], uses: [agent, build]}
    client-qa:   {track: client, stage: gate, worktree: true,  pushes: [], uses: [agent, client, build]}
    server-qa:   {track: server, stage: gate, worktree: false, pushes: [fork-docs, fork-gate], uses: [agent, client, build]}
    integrator:  {track: server, stage: train, worktree: false, pushes: [fork-tools], uses: [agent, build]}
    harness-dev: {track: harness, stage: dev, worktree: true,  pushes: [], uses: [agent]}
  names: {client-dev: cd, server-dev: sd, client-qa: cq, server-qa: sq, integrator: ig, harness-dev: hd}

evidence:
  client_repack_telemetry_lines: 7
  client_device_evidence: ["*logcat*.txt", "*.dump.*", "*devtools*.json", "*.png"]
  client_network_report: "netqa*.md"

priorities: {P0: 0, P1: 1, P2: 2, P3: 3}
