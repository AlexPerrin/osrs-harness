# Harness policy v4 (BR-P*): one versioned file read by the daemon, the hooks and the briefs. Rules, not prose.
version: 4

tracks:
  client:
    live_target: master              # a client change is live when master contains its commit
    branch_prefixes: [client/]
    dev_role: client-dev
    qa_role: client-qa
    dev_slots: 0                     # = Android instances (BR-R5); 0 while BlueStacks is off and server-dev goes first (user 2026-10-24)
    instances: [device]              # granted to a dev at dispatch
    qa_instances: [device, desktop]
  server:
    live_target: integration         # pin = commit and the live server runs that integration (live.json)
    branch_prefixes: [content/, fix/, local/]
    dev_role: server-dev
    qa_role: server-qa
    dev_slots: 2
    instances: [desktop]
    qa_instances: [desktop]
  harness:
    live_target: master
    branch_prefixes: [harness/]
    dev_role: harness-dev
    dev_slots: 1
    instances: []

repos:
  ours: AlexPerrin/osrs-plugins-reverse
  fork: AlexPerrin/OpenRune-Server
  upstream: OpenRune/OpenRune-Server
  fork_remote: fork
  upstream_remote: origin
  docs_branch: docs

resources:                           # every lease (BR-R1); instances come from tools/instances.tsv too
  device:      {kind: android, default_minutes: 300}
  desktop:     {kind: desktop, default_minutes: 300}
  desktop2:    {kind: desktop, default_minutes: 300}
  integration: {kind: lock, default_minutes: 90}      # one train at a time (BR-B2)
  live-server: {kind: lock, default_minutes: 30}      # a deploy
  ghidra:      {kind: lock, default_minutes: 120}     # the one Ghidra writer

leases:                              # in use = the holder's process is alive (bound at take); the minutes below are backstops
  heartbeat_minutes: 20              # only for a holder with nothing attached (not spawned by the daemon)
  drain_cap_minutes: 30              # a pending deploy reclaims idle holders at once; busy ones only past this backstop

batches:
  train_debounce_minutes: 10         # BR-B1
  gate_timeout_minutes: 60
  image_timeout_minutes: 30
  deploy_ready_timeout_seconds: 300  # "Server ready in", else auto-rollback (BR-B3)
  release_after_live_changes: 6      # BR-B6: a release batch after N live client changes (or on demand)

agents:
  max_concurrent: 3                  # total running agents (the usage window, not dollars, is the constraint)
  roles:
    client-dev:  {track: client, stage: dev,  worktree: true,  pushes: []}
    server-dev:  {track: server, stage: dev,  worktree: false, pushes: [fork]}
    client-qa:   {track: client, stage: gate, worktree: true,  pushes: []}
    server-qa:   {track: server, stage: gate, worktree: false, pushes: [fork-docs]}
    integrator:  {track: server, stage: train, worktree: false, pushes: [fork-tools]}
    harness-dev: {track: harness, stage: dev, worktree: true,  pushes: []}
  names: {client-dev: cd, server-dev: sd, client-qa: cq, server-qa: sq, integrator: ig, harness-dev: hd}

evidence:
  client_repack_telemetry_lines: 7
  client_device_evidence: ["*logcat*.txt", "*.dump.*", "*devtools*.json", "*.png"]
  client_network_report: "netqa*.md"

priorities: {P0: 0, P1: 1, P2: 2, P3: 3}
