# hd: repos, paths, the tracks, the roles (the guard's refs and the record each owes), the agent count.
repos: {client: AlexPerrin/osrs-plugins-reverse, fork: AlexPerrin/OpenRune-Server, upstream: OpenRune/OpenRune-Server, harness: AlexPerrin/osrs-harness}
paths: {client: ~/osrs-plugins-reverse, fork: ~/src/OpenRune-Server, work: ~/src/openrune-work}
tracks:                        # head: the dev ref; base: what a change is checked against and merged into
  client:  {dev: client-dev,  reviewer: client-qa, head: origin/client/<slug>, base: origin/main, remote: origin, checkout_branch: master}
  server:  {dev: server-dev,  reviewer: server-qa, head: fork/dev/<slug>,      base: origin/main}
  harness: {dev: harness-dev,                      head: harness/<slug>,       base: main,        remote: origin}
roles:                         # push: the refs a role may push, by repo; record: what a run owes; worktree: spawned in one
  client-dev:   {record: handover, worktree: true, push: {client: ["client/<slug>"]}}
  client-qa:    {record: verdict,  worktree: true}
  server-dev:   {record: handover, push: {fork: ["dev/<slug>"]}}
  server-qa:    {record: verdict,  push: {fork: ["gate/<slug>", "docs"]}}
  integrator:   {push: {fork: ["local/*", "fin/*"]}}
  harness-dev:  {record: handover, worktree: true}
  orchestrator: {record: measure}
agents: 3
